<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur Burda – Glasgow</title>

<link rel="icon" href="/favicon.png?v=3" type="image/png">
<link rel="shortcut icon" href="/favicon.png?v=3" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png?v=3">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.cover {
    min-height: 90vh;
    padding: 72px 24px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 0.01em;
}

.subtitle {
    color: #666666;
    margin-top: 12px;
    font-size: 1rem;
    font-weight: 300;
}

.intro-image {
    margin-top: 56px;
    width: 100%;
    max-width: 560px;
}

.intro-image img {
    width: 100%;
    height: auto;
    display: block;
}

.gallery {
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 60px 80px;
    position: relative;
}

.gallery img {
    position: absolute;
    height: auto;
    display: block;
    cursor: pointer;
    transition: opacity 0.2s ease;
}

.gallery img:hover {
    opacity: 0.9;
}

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.97);
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px 20px;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 92vw;
    max-height: 82vh;
    width: auto;
    height: auto;
}

.prev,
.next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #cfcfcf;
    font-size: 2.2rem;
    cursor: pointer;
    z-index: 10000;
}

.prev:hover,
.next:hover {
    color: #777;
}

.prev {
    left: 0;
}

.next {
    right: 0;
}

.close {
    position: fixed;
    top: 20px;
    right: 30px;
    background: none;
    border: none;
    font-size: 2rem;
    color: #111;
    cursor: pointer;
    padding: 16px;
}

footer {
    text-align: center;
    padding: 56px 24px;
    color: #666666;
    font-size: 0.88rem;
    line-height: 1.8;
}

@media (max-width: 700px) {

    .cover {
        min-height: 85vh;
        padding: 56px 16px 40px;
    }

    h1 {
        font-size: 2.2rem;
    }

    .subtitle {
        font-size: 0.95rem;
    }

    .intro-image {
        margin-top: 42px;
        max-width: 420px;
    }

    .gallery {
        padding: 0 20px 40px;
    }

    .lightbox {
        padding: 24px 14px;
    }

    .lightbox img {
        max-width: 94vw;
        max-height: 78vh;
    }

    .prev,
    .next {
        top: auto;
        bottom: 22px;
        transform: none;
        font-size: 2rem;
        color: #999999;
        background: rgba(255,255,255,0.75);
        padding: 8px 18px;
    }

    .prev {
        left: 70px;
    }

    .next {
        right: 70px;
    }

    .close {
        top: 10px;
        right: 14px;
    }
}
</style>
</head>

<body>

<section class="cover">
    <h1>Arthur Burda</h1>
    <p class="subtitle">Glasgow</p>

    <div class="intro-image">
        <img src="../glasgow-images/0.jpg" alt="">
    </div>
</section>

<div class="lightbox" id="lightbox">
    <button class="close" onclick="closeLightbox()">×</button>
    <button class="prev" onclick="prevImage()">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="next" onclick="nextImage()">›</button>
</div>

<footer>
    © 2026 Arthur Burda
</footer>

<script>
const gallery = document.getElementById("gallery");
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

let currentIndex = 0;
let touchStartX = 0;
let touchEndX = 0;

function getColumnCount() {
    if (window.innerWidth <= 700) return 2;
    if (window.innerWidth <= 1000) return 3;
    return 4;
}

function getGap() {
    if (window.innerWidth <= 700) return 8;
    return 14;
}

function layoutMasonry() {

    const columnCount = getColumnCount();
    const gap = getGap();

    const styles = window.getComputedStyle(gallery);
    const paddingLeft = parseFloat(styles.paddingLeft);
    const paddingRight = parseFloat(styles.paddingRight);

    const galleryWidth = gallery.clientWidth - paddingLeft - paddingRight;
    const columnWidth = (galleryWidth - gap * (columnCount - 1)) / columnCount;

    const columnHeights = new Array(columnCount).fill(0);

    images.forEach((img) => {

        img.style.width = columnWidth + "px";

        const shortestColumn =
            columnHeights.indexOf(Math.min(...columnHeights));

        const x = paddingLeft + shortestColumn * (columnWidth + gap);
        const y = columnHeights[shortestColumn];

        img.style.left = x + "px";
        img.style.top = y + "px";

        const ratio = img.naturalHeight / img.naturalWidth || 1.5;
        const displayedHeight = columnWidth * ratio;

        columnHeights[shortestColumn] += displayedHeight + gap;
    });

    gallery.style.height = Math.max(...columnHeights) + "px";
}

images.forEach((img, index) => {

    img.addEventListener("load", layoutMasonry);

    img.addEventListener("click", () => {

        currentIndex = index;
        lightboxImg.src = img.src;

        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
    });
});

window.addEventListener("load", layoutMasonry);
window.addEventListener("resize", layoutMasonry);

function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
}

function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex].src;
}

function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
}

document.addEventListener("keydown", function(e) {

    if (!lightbox.classList.contains("active")) return;

    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
});

lightbox.addEventListener("touchstart", function(e) {
    touchStartX = e.changedTouches[0].screenX;
});

lightbox.addEventListener("touchend", function(e) {

    touchEndX = e.changedTouches[0].screenX;
    const diff = touchStartX - touchEndX;

    if (Math.abs(diff) > 50) {

        if (diff > 0) {
            nextImage();
        } else {
            prevImage();
        }
    }
});

lightbox.addEventListener("click", function(e) {

    if (
        e.target === lightbox &&
        window.innerWidth > 700
    ) {
        closeLightbox();
    }
});
</script>

</body>
</html>
